# Banco exclusivo para experimentar Flyway
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_api_flyway_lab

# Ativar Flyway somente neste perfil
spring.flyway.enabled=true

# Não registrar baseline automaticamente
spring.flyway.baseline-on-migrate=false

# Inicializar a aplicação sem servidor HTTP
spring.main.web-application-type=none

#Avisa quando o nome esta errado
spring.flyway.validate-migration-naming=true