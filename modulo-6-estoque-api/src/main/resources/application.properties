spring.application.name=estoque-api

spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_api
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Endpoints de monitoramento
management.endpoints.web.exposure.include=health,info,metrics,mappings
# Detalhes do Health Check (somente para desenvolvimento local)
management.endpoint.health.show-details=always

# Mostrar detalhes do health — útil em desenvolvimento
# Em produção: "when-authorized" ou "never"
#management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informações do /actuator/info
info.app.name=Estoque API
info.app.description=API REST para gerenciamento de estoque
info.app.version=0.6.0

logging.level.br.com.raimundo.estoque=DEBUG



# Mostra no console as queries SQL geradas pelo Hibernate
spring.jpa.show-sql=true
# Formata o SQL gerado para ficar legível no console
spring.jpa.properties.hibernate.format_sql=true
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
# Não executar baseline automaticamente
spring.flyway.baseline-on-migrate=false